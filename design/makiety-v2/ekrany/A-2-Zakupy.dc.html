<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { o: {}, potw: {}, aktywny: null, zmiana: false, cala: false, podglad: null };
  }
  renderVals() {
    const L = 'Lidl · Zorska', B = 'Biedronka · Wodzisławska', K = 'Kaufland · Rybnik';
    const sklepy = [L, B, K];
    const sekcje = [
      { sklep: L, nazwa: 'Warzywa', gdzie: 'zaraz za wejściem, po lewej', pozycje: [{ id: 'a', nazwa: 'Ziemniaki · 2 kg', cena: '5,98' }, { id: 'b', nazwa: 'Pomidory · 4 szt.', cena: '5,16' }] },
      { sklep: L, nazwa: 'Piekarnia', gdzie: 'lada przy górnej ścianie', pozycje: [{ id: 'c', nazwa: 'Chleb żytni', cena: '5,49' }] },
      { sklep: L, nazwa: 'Sery i nabiał', gdzie: 'lodówki przy prawej ścianie', pozycje: [{ id: 'd', nazwa: 'Ser żółty gouda, 150 g', cena: '2,99' }, { id: 'e', nazwa: 'Mleko · 2 szt.', cena: '7,58' }] },
      { sklep: L, nazwa: 'Kawa', gdzie: 'alejka 4', pozycje: [{ id: 'f', nazwa: 'Kawa ziarnista, 1 kg', cena: '39,99' }] },
      { sklep: B, nazwa: 'Owoce', gdzie: 'zaraz za wejściem', pozycje: [{ id: 'g', nazwa: 'Pomarańcze · 1 kg', cena: '4,99' }] },
      { sklep: B, nazwa: 'Mięso', gdzie: 'lodówki przy tylnej ścianie', pozycje: [{ id: 'h', nazwa: 'Filet z kurczaka · 1 kg', cena: '15,99' }] },
      { sklep: K, nazwa: 'Chemia', gdzie: 'alejka 12', pozycje: [{ id: 'i', nazwa: 'Papier toaletowy', cena: '14,99' }] }
    ];
    const st = this.state, o = st.o;
    const potw = st.potw || o;
    const pozSklepu = (k) => sekcje.filter((x) => x.sklep === k).reduce((a, x) => a.concat(x.pozycje), []);
    const gotowy = (k) => pozSklepu(k).every((p) => potw[p.id]);
    const zostaly = sklepy.filter((k) => !gotowy(k));
    const wszystkoGotowe = zostaly.length === 0;
    const odm = (n) => n + ' ' + (n === 1 ? 'produkt' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'produkty' : 'produktów');
    const kr = (k) => k.split(' · ')[0];
    const miejsc = { Lidl: 'Lidlu', Biedronka: 'Biedronce', Kaufland: 'Kauflandzie' };
    const aktywnyGotowy = st.aktywny && gotowy(st.aktywny);
    const wybor = !wszystkoGotowe && !st.cala && (!st.aktywny || st.zmiana || aktywnyGotowy);
    const E = 'cubic-bezier(.2,.8,.2,1)';
    // odhaczenie: kółko wypełnia się i „pyka”, ptaszek się rysuje, tekst przekreśla się od lewej
    const znakStyl = (done, r) => 'width: ' + r + 'px; height: ' + r + 'px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; transition: background-color .2s ease, border-color .2s ease; ' + (done ? 'background: var(--akcent); border: 2px solid var(--akcent); animation: pop .42s ' + E + ', blysk .6s ease-out' : 'background: transparent; border: 2px solid var(--ramka)');
    const ptaszek = (done) => 'stroke-dasharray: 22; stroke-dashoffset: ' + (done ? 0 : 22) + '; transition: stroke-dashoffset .28s ease ' + (done ? '.08s' : '0s');
    const tekstStyl = (done, f) => 'font-size: ' + f + 'px; font-weight: 500; transition: color .3s ease; color: ' + (done ? 'var(--odhaczony)' : 'var(--tusz)');
    const kreska = (done) => 'position: absolute; left: 0; top: 52%; height: 2px; border-radius: 1px; background: var(--odhaczony); pointer-events: none; width: ' + (done ? '100%' : '0') + '; transition: width .32s ' + E + ' ' + (done ? '.1s' : '0s');
    const przelacz = (id, done) => () => {
      this.setState({ o: Object.assign({}, o, { [id]: !done }) });
      clearTimeout(this.t);
      this.t = setTimeout(() => this.setState({ potw: this.state.o, podglad: null }), 650);
    };
    const opcje = sklepy.map((k) => {
      const ps = pozSklepu(k), zost = ps.filter((p) => !potw[p.id]).length, zr = zost === 0;
      return {
        nazwa: k, litera: k.charAt(0), zrobiony: zr,
        opis: zr ? 'Zrobione' : (zost === ps.length ? odm(ps.length) : 'Zostało ' + zost + ' z ' + ps.length),
        styl: 'width: 100%; min-height: 68px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-radius: 18px; text-align: left; font-family: inherit; cursor: pointer; ' + (zr ? 'border: 1.5px solid var(--linia); background: #ffffff; opacity: .5' : (k === st.aktywny && !aktywnyGotowy ? 'border: 2px solid var(--akcent); background: #ffffff' : 'border: 1.5px solid var(--ramka); background: #ffffff')),
        wybierz: () => this.setState({ aktywny: k, zmiana: false, cala: false, podglad: null })
      };
    });
    const ak = (!st.aktywny || aktywnyGotowy) ? zostaly[0] : st.aktywny;
    const tuSekcje = sekcje.filter((x) => x.sklep === ak);
    const idx = tuSekcje.findIndex((x) => x.pozycje.some((p) => !potw[p.id]));
    const s = tuSekcje[idx < 0 ? 0 : idx] || sekcje[0];
    const nast = tuSekcje[idx + 1];
    const tuPoz = pozSklepu(ak || L);
    const tuZrob = tuPoz.filter((p) => o[p.id]).length;
    const wsz = sekcje.reduce((a, x) => a.concat(x.pozycje.map((p) => Object.assign({ sklep: x.sklep, dzial: x.nazwa }, p))), []);
    const wszZrob = wsz.filter((p) => o[p.id]).length;
    const trwa = !wszystkoGotowe && !wybor && !st.cala;
    const teraz = idx < 0 ? -1 : idx;
    const otwartyIdx = st.podglad !== null && st.podglad !== undefined && st.podglad < tuSekcje.length ? st.podglad : teraz;
    const dzialy = tuSekcje.map((d, i) => {
      const zr = d.pozycje.every((p) => potw[p.id]);
      const otw = i === otwartyIdx;
      const ile = d.pozycje.filter((p) => o[p.id]).length;
      const jestTeraz = i === teraz;
      return {
        nazwa: d.nazwa, nr: String(i + 1), krok: 'krok ' + (i + 1) + ' z ' + tuSekcje.length, otwarty: otw, zrobiony: zr, niezrobiony: !zr,
        gdzie: otw ? d.gdzie : (zr ? 'Zrobione' : d.gdzie),
        licznik: ile + ' z ' + d.pozycje.length,
        rozwin: () => { if (i !== otwartyIdx) this.setState({ podglad: i }); else if (i !== teraz) this.setState({ podglad: null }); },
        styl: 'border-radius: 22px; ' + (otw ? 'padding: 16px 16px 14px; background: var(--akcent-jasny); box-shadow: inset 0 0 0 0 transparent' : zr ? 'padding: 0 16px; background: #ffffff; box-shadow: inset 0 0 0 1.5px var(--linia)' : 'padding: 0 16px; background: var(--chip); box-shadow: inset 0 0 0 0 transparent'),
        ikonaStyl: 'width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; box-sizing: border-box; transition: background-color .3s ease, color .3s ease; ' + (zr ? 'background: var(--akcent); color: #ffffff; animation: pop .45s ' + E : otw ? 'background: var(--akcent); color: #ffffff' : 'background: #ffffff; color: var(--wyciszony); border: 1.5px solid var(--ramka)'),
        etykietaStyl: 'display: block; overflow: hidden; font-size: 13px; font-weight: 700; color: var(--akcent-ciemny); ' + (otw && jestTeraz ? 'height: 18px; opacity: 1' : 'height: 0; opacity: 0'),
        nazwaStyl: 'font-weight: 700; line-height: 1.1; ' + (otw ? 'font-size: 30px; letter-spacing: -0.03em; color: var(--tusz)' : 'font-size: 16px; letter-spacing: 0; color: ' + (zr ? 'var(--odhaczony)' : 'var(--tusz)')),
        gdzieStyl: 'font-size: 13px; margin-top: 2px; transition: color .3s ease; color: ' + (otw ? 'var(--akcent-ciemny)' : 'var(--wyciszony)'),
        licznikStyl: 'font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--wyciszony); ' + (otw ? 'opacity: 0' : 'opacity: 1'),
        cialoStyl: 'display: grid; grid-template-rows: ' + (otw ? '1fr' : '0fr'),
        pozycje: d.pozycje.map((p) => ({ nazwa: p.nazwa, cena: p.cena + ' zł', zrobione: !!o[p.id],
          styl: 'width: 100%; min-height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-radius: 18px; border: 0; transition: background-color .3s ease; background: ' + (o[p.id] ? 'rgba(255,255,255,.55)' : '#ffffff') + '; text-align: left; font-family: inherit; cursor: pointer',
          znak: znakStyl(!!o[p.id], 30), ptaszek: ptaszek(!!o[p.id]), tekst: tekstStyl(!!o[p.id], 17), kreska: kreska(!!o[p.id]), przelacz: przelacz(p.id, !!o[p.id]) }))
      };
    });
    const pigSeg = (on) => 'height: 38px; border-radius: 10px; border: 0; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #ffffff; color: var(--tusz); box-shadow: 0 1px 3px rgba(18,28,36,.12)' : 'background: transparent; color: var(--wyciszony)');
    const ostatniGotowy = st.aktywny && aktywnyGotowy ? kr(st.aktywny) : '';
    return {
      wybor, trwa, cala: !!st.cala, koniec: wszystkoGotowe && !st.cala,
      maSklep: !!st.aktywny && !st.cala && !wybor, bezSklepu: !st.aktywny || st.cala || wybor,
      sklepTeraz: ak || '', zmienSklep: () => this.setState({ zmiana: true }),
      pokazPrzelacznik: !wszystkoGotowe || st.cala,
      poKolei: () => this.setState({ cala: false }), calaLista: () => this.setState({ cala: true, zmiana: false }),
      stylPoKolei: pigSeg(!st.cala), stylCala: pigSeg(!!st.cala),
      zrobionyInfo: ostatniGotowy && !st.zmiana ? ostatniGotowy + ' zrobiony' : '',
      pytanie: ostatniGotowy && !st.zmiana ? (zostaly.length > 1 ? 'Do którego sklepu teraz?' : zostaly.length ? 'Został ' + kr(zostaly[0]) + '. Idziesz?' : '') : 'W którym sklepie jesteś?',
      opcje,
      krok: 'krok ' + (idx + 1) + ' z ' + tuSekcje.length,
      sekcja: s.nazwa, gdzie: s.gdzie,
      pozycje: s.pozycje.map((p) => ({ nazwa: p.nazwa, cena: p.cena + ' zł', styl: 'width: 100%; min-height: 62px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-radius: 18px; border: 0; background: ' + (o[p.id] ? 'rgba(255,255,255,.55)' : '#ffffff') + '; text-align: left; font-family: inherit; cursor: pointer', znak: znakStyl(!!o[p.id], 30), tekst: tekstStyl(!!o[p.id], 17), przelacz: przelacz(p.id, !!o[p.id]) })),
      nastepna: nast ? nast.nazwa + ' · ' + nast.gdzie : (zostaly.length > 1 ? 'Kasa, potem wybierzesz kolejny sklep' : 'Kasa'),
      dzialy, kasaTxt: zostaly.length > 1 ? 'Kasa, potem kolejny sklep' : 'Kasa',
      wszystkie: wsz.map((p) => ({ nazwa: p.nazwa, cena: p.cena + ' zł', gdzie: kr(p.sklep) + ' · ' + p.dzial, znak: znakStyl(!!o[p.id], 26), ptaszek: ptaszek(!!o[p.id]), tekst: tekstStyl(!!o[p.id], 16), kreska: kreska(!!o[p.id]), przelacz: przelacz(p.id, !!o[p.id]) })),
      postep: (trwa ? tuZrob + ' z ' + tuPoz.length + ' w ' + (miejsc[kr(ak)] || kr(ak)) : wszZrob + ' z ' + wsz.length),
      pasekStyl: 'height: 100%; border-radius: 4px; background: var(--akcent); width: ' + Math.round((trwa ? tuZrob / tuPoz.length : wszZrob / wsz.length) * 100) + '%',
      odNowa: () => this.setState({ o: {}, potw: {}, aktywny: null, zmiana: false, cala: false, podglad: null })
    };
  }
}
</script>
