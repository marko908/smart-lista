    const doD = (pts) => prosta(pts).map((p, i) => (i ? 'L' : 'M') + px(p)[0].toFixed(1) + ' ' + px(p)[1].toFixed(1)).join(' ');
    let pts = [], piny = [], metry = 0, celSekcje = [], kolejnosc = [];
    if (st.tryb === 'cel') {
      const pr = PRODUKTY.find((p) => p.id === st.cel);
      const { dist, prev } = this.bfs(st.ja);
      const cel = this.wolnaObok(pr.sekcja, dist);
      if (cel) { pts = this.sciezka(prev, cel.x + ',' + cel.y, startK); metry = cel.d; }
      celSekcje = [pr.sekcja];
      const b = this.B.filter((b) => b.s.indexOf(pr.sekcja) >= 0).sort((a, b2) => (Math.abs(a.x - (cel ? cel.x : 0)) + Math.abs(a.y - (cel ? cel.y : 0))) - (Math.abs(b2.x - (cel ? cel.x : 0)) + Math.abs(b2.y - (cel ? cel.y : 0))))[0];
      if (b) piny.push({ x: (b.x + b.w / 2) * C, y: Math.max(12, b.y * C + (b.h * C) / 2), n: '' });
    } else {
      // cała trasa: kolejne produkty od najbliższego, na końcu kasa
      let pos = st.ja, posK = startK, zostale = PRODUKTY.slice(), nr = 1;
      while (zostale.length) {
        const { dist, prev } = this.bfs(pos);
        let best = null;
        zostale.forEach((p) => { const c = this.wolnaObok(p.sekcja, dist); if (c && (!best || c.d < best.c.d)) best = { p, c }; });
        if (!best) break;
        const odc = this.sciezka(prev, best.c.x + ',' + best.c.y, posK);
        pts = pts.concat(pts.length ? odc.slice(1) : odc); metry += best.c.d;
        piny.push({ x: px([best.c.x, best.c.y])[0], y: px([best.c.x, best.c.y])[1], n: String(nr++) });
        celSekcje.push(best.p.sekcja); kolejnosc.push(best.p.n);
        pos = [best.c.x, best.c.y]; posK = best.c.x + ',' + best.c.y;
        zostale = zostale.filter((p) => p !== best.p);
      }
      const { dist, prev } = this.bfs(pos);
      const kasa = [[14, 34], [18, 34], [10, 34]].find((k) => (k[0] + ',' + k[1]) in dist);
      if (kasa) { const odc = this.sciezka(prev, kasa[0] + ',' + kasa[1], posK); pts = pts.concat(odc.slice(1)); metry += dist[kasa[0] + ',' + kasa[1]]; }
    }
    const kolor = { 'regal-scienny': '#dde4e9', lodowka: '#d3e4ef', zamrazarka: '#c7dbea', stoisko: '#d7e9d3', lada: '#ecdfc9', kosz: '#e6e1d6', klocek: '#cfd7dc', sciana: '#bcc6cd', kasy: '#3b4a54', wejscie: 'transparent' };
    const zrobS = ZROBIONE.map((z) => z.sekcja);
    const bloki = this.B.map((b) => {
      const cel = b.s.some((s) => celSekcje.indexOf(s) >= 0);
      const zr = !cel && b.s.some((s) => zrobS.indexOf(s) >= 0);
      return { styl: 'position: absolute; left: ' + (b.x * C + 0.75) + 'px; top: ' + (b.y * C + 0.75) + 'px; width: ' + (b.w * C - 1.5) + 'px; height: ' + (b.h * C - 1.5) + 'px; border-radius: 3px; box-sizing: border-box; transition: background-color .3s ease; ' +
        (cel ? 'background: var(--akcent); box-shadow: 0 0 0 2px rgba(29,95,138,.25); animation: blysk 1.4s ease-in-out infinite' : b.t === 'wejscie' ? 'border: 1.5px dashed var(--wyciszony)' : 'background: ' + (zr ? '#e9f0e6' : kolor[b.t] || '#dde4e9')) };
    });
    const ET = [['Warzywa i owoce', 8, 14.5], ['Piekarnia', 1.4, 23], ['Mięso i drób', 8.8, 5.5], ['Nabiał', 20.6, 1.9], ['Mrożonki', 24.5, 14.5], ['Napoje', 19.5, 26], ['Alkohole', 24.9, 25.5], ['Chemia', 14.6, 30.5], ['Kosmetyki', 14.5, 23.2], ['Kasy', 17.5, 37.5], ['Wejście', 2.5, 38.4]];
    const etykiety = ET.map(([n, x, y]) => ({ n, styl: 'position: absolute; left: ' + (x * C) + 'px; top: ' + (y * C) + 'px; transform: translate(-50%, -50%); padding: 1px 5px; border-radius: 6px; font-size: 9.5px; font-weight: 700; white-space: nowrap; pointer-events: none; ' + (n === 'Kasy' ? 'color: #ffffff' : 'color: #4a5862; background: rgba(255,255,255,.8)') }));
    const pinyFix = piny.map((p) => ({ n: p.n, styl: 'position: absolute; left: ' + (p.x - 12) + 'px; top: ' + (p.y - 12) + 'px; width: 24px; height: 24px; border-radius: 50%; background: var(--tusz); border: 2.5px solid #ffffff; box-sizing: border-box; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 11px; font-weight: 700; z-index: 3' }));
    const chipStyl = (on) => 'height: 36px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; ' + (on ? 'border: 0; background: var(--tusz); color: #ffffff' : 'border: 1.5px solid var(--ramka); background: #ffffff; color: var(--tusz)');
    const chipy = [{ n: 'Cała trasa', on: st.tryb === 'trasa', wybierz: () => this.setState({ tryb: 'trasa', wskaz: false }) }].concat(PRODUKTY.map((p) => ({ n: p.n, on: st.tryb === 'cel' && st.cel === p.id, wybierz: () => this.setState({ tryb: 'cel', cel: p.id, wskaz: false }) })))
      .map((c) => ({ n: c.n, on: c.on ? 'true' : 'false', wybierz: c.wybierz, styl: chipStyl(c.on) }));
    const pr = PRODUKTY.find((p) => p.id === st.cel);
    const [jx, jy] = px(st.ja);
    const sek = (m) => Math.max(10, Math.round(m * 1.2 / 10) * 10);
    return {
      chipy, bloki, etykiety, piny: pinyFix, trasaD: pts.length > 1 ? doD(pts) : 'M0 0',
      kropkaStyl: 'position: absolute; left: ' + jx + 'px; top: ' + jy + 'px; width: 0; height: 0; z-index: 4',
      mapaStyl: 'position: relative; width: 366px; height: 514px; border-radius: 24px; background: #f4f6f8; overflow: hidden; cursor: ' + (st.wskaz ? 'crosshair' : 'default') + '; box-shadow: ' + (st.wskaz ? 'inset 0 0 0 2px var(--akcent)' : 'inset 0 0 0 1px var(--linia)') + '; transition: box-shadow .2s ease',
      wskazStyl: 'position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 12px; border-radius: 14px; background: var(--tusz); color: #ffffff; font-size: 14px; font-weight: 700; text-align: center; transition: opacity .25s ease, transform .3s cubic-bezier(.2,.8,.2,1); pointer-events: none; ' + (st.wskaz ? 'opacity: 1; transform: none' : 'opacity: 0; transform: translateY(8px)'),
      opisMapy: 'Plan sklepu Lidl Zorska z trasą do produktu',
      nadtytul: st.tryb === 'cel' ? pr.gdzie : 'Twoja trasa · ' + PRODUKTY.length + ' produkty, potem kasa',
      tytul: st.tryb === 'cel' ? pr.pelna : kolejnosc.map((n, i) => (i + 1) + '. ' + n).join('   ') + '   → kasa',
      podtytul: (st.tryb === 'cel' ? 'ok. ' + metry + ' m stąd, ok. ' + sek(metry) + ' s pieszo' : 'ok. ' + metry + ' m razem z drogą do kasy') + ' · ' + (st.recznie ? 'miejsce wskazane ręcznie' : 'jesteś przy mleku (ostatnio odhaczone)'),
      gdzieTxt: st.wskaz ? 'Anuluj' : 'Jestem gdzie indziej',
      gdzieStyl: 'height: 52px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ' + (st.wskaz ? 'border: 1.5px solid var(--akcent); background: var(--akcent-jasny); color: var(--akcent-ciemny)' : 'border: 1.5px solid var(--ramka); background: #ffffff; color: var(--tusz)'),
      glownyTxt: st.tryb === 'cel' ? 'Mam to' : 'Wróć do listy',
      gdzieIndziej: () => this.setState({ wskaz: !st.wskaz }),
      stuknij: (e) => {
        if (!this.state.wskaz) return;
        const r = e.currentTarget.getBoundingClientRect(), sk = r.width / 366;
        let cx = Math.floor(((e.clientX - r.left) / sk - 8) / C), cy = Math.floor(((e.clientY - r.top) / sk - 7) / C);
        // przyciągnij do najbliższej wolnej kratki
        let best = null;
        for (let x = 0; x < 28; x++) for (let y = 0; y < 40; y++) { if (this.zaj[x + ',' + y]) continue; const dd = Math.abs(x - cx) + Math.abs(y - cy); if (!best || dd < best.d) best = { x, y, d: dd }; }
        if (best) this.setState({ ja: [best.x, best.y], wskaz: false, recznie: true });
      }
    };
  }
}
</script>
