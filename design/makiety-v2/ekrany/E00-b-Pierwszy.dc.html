<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Pierwsze uruchomienie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
/* Kolory w jednym miejscu: zmiana motywu = zmiana tych wartości */
:root{--akcent:#1d5f8a;--akcent-ciemny:#164a6b;--akcent-jasny:#e3eff7;--tusz:#121c24;--wyciszony:#5d6b75;--linia:#edf1f4;--chip:#f2f5f7;--ramka:#c8d5de;--odhaczony:#98a4ad}
body{margin:0}
a{color:inherit;text-decoration:none}
.cta{transition:background-color .18s ease,transform .15s ease}.cta:hover{background:var(--akcent-ciemny)!important}.cta:active{transform:scale(.97)}
@keyframes plyn{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.plyn{animation:plyn 3.2s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: var(--tusz); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 28px 22px 10px; display: flex; flex-direction: column; gap: 14px">
    <div>
      <a href="E01-c-MVP.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px dashed var(--ramka); color: var(--akcent-ciemny); font-size: 13px; font-weight: 500">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
        Wybierz sklep
      </a>
    </div>
    <h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.035em; line-height: 1">Cześć!</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: var(--wyciszony)">Zrób listę tak jak zawsze. My ułożymy ją w kolejności, w jakiej miniesz produkty w sklepie, od wejścia do kasy.</p>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; padding: 0 22px">
    <div class="plyn" style="width: 230px; padding: 16px; border-radius: 22px; background: var(--chip); display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{przyklad}}" as="p" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 22px; height: 22px; border-radius: 50%; background: var(--akcent-jasny); color: var(--akcent-ciemny); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
          <span style="flex: 1; font-size: 14px; font-weight: 500">{{p.nazwa}}</span>
          <span style="font-size: 11px; color: var(--wyciszony)">{{p.dzial}}</span>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 13px; color: var(--wyciszony); text-align: center">Tak wygląda lista ułożona według alejek.</span>
  </div>

  <div style="padding: 8px 22px 14px; display: flex; flex-direction: column; gap: 10px">
    <a href="E01-b-Pusta.dc.html" class="cta" style="height: 58px; border-radius: 999px; background: var(--akcent); color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 700; box-shadow: 0 8px 20px rgba(29,95,138,.25)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Zrób pierwszą listę
    </a>
    <a href="E01-b-Pusta.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: var(--akcent)">Wklej listę z notatek</a>
  </div>

  <nav aria-label="Główna nawigacja" style="height: 62px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--linia)">
    <a href="E00-b-Pierwszy.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--akcent)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg>Listy</a>
    <a href="A-4-Promocje.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--wyciszony)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path></svg>Promocje</a>
    <a href="A-8-Paragony.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--wyciszony)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path></svg>Paragony</a>
    <a href="E00-b-Pierwszy.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--wyciszony)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Konto</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { przyklad: [
      { n: '1', nazwa: 'Pomidory', dzial: 'warzywa' },
      { n: '2', nazwa: 'Chleb', dzial: 'pieczywo' },
      { n: '3', nazwa: 'Ser żółty', dzial: 'nabiał' },
      { n: '4', nazwa: 'Mleko', dzial: 'nabiał' }
    ] };
  }
}
</script>
</body>
</html>
